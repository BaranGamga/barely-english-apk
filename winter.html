<!doctype html>

<head>

<title>Barely English · Winter Smells Cold</title>

<link rel="icon" type="image/png" href="icons/icon-192.png">

<style>
/* Layout: phone-first single column, sticky level header, bottom tab bar, Zohre the duck reacts in quiz */
:root{
  --bg:#f5effd; --surface:#ffffff; --fg:#2a1145; --muted:#6e5a8a; --line:#e4d8f5;
  --accent:#7b2fd0; --accent-ink:#ffffff; --accent-soft:#ece0fb;
  --sun:#ffc928; --sun-soft:#fff3c4; --good:#14a35f; --good-soft:#d8f6e6; --bad:#ef5644; --bad-soft:#ffe1dc;
  --owl:#8a6a4f; --owl-belly:#f3dcc0;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
  --top:env(safe-area-inset-top,0px); --bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1c0b30; --surface:#2a1446; --fg:#f6efff; --muted:#b9a6d6; --line:#3e2463;
  --accent:#b47cff; --accent-ink:#1c0b30; --accent-soft:#3f2266;
  --sun:#ffcf5c; --sun-soft:#3d3214; --good:#39d98a; --good-soft:#123d29; --bad:#ff7a69; --bad-soft:#4a1f1a;
  --owl:#b08c6c; --owl-belly:#e8cfae; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;user-select:none;-webkit-user-select:none}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}
h1{font-size:1.9rem} h2{font-size:1.35rem} h3{font-size:1.1rem}
.muted{color:var(--muted)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + var(--top)) 16px 10px;display:flex;align-items:center;gap:12px}
.lvl{width:44px;height:44px;border-radius:50%;background:var(--sun);color:#3a2a00;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.2rem;flex:none}
.xpbox{flex:1;min-width:0}
.xpbox small{display:flex;justify-content:space-between;font-weight:800;font-size:.78rem;color:var(--muted)}
.xpbar{height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--sun);border-radius:10px;transition:width .6s cubic-bezier(.2,1.4,.4,1)}
.chip{display:flex;align-items:center;gap:4px;font-weight:800;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px;flex:none}
.iconbtn{background:none;border:0;color:var(--muted);padding:6px;flex:none}
.iconbtn svg{width:24px;height:24px}
main{max-width:560px;margin:0 auto;padding:4px 16px calc(96px + var(--bottom));display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:13px 16px;font-weight:800;color:inherit;transition:transform .08s}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn:active{box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000);transform:translateY(3px)}
.btn.soft{background:var(--accent-soft);color:var(--fg);box-shadow:none}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.hero{display:flex;gap:14px;align-items:center}
.hero .owlwrap{width:120px;flex:none}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:700}
.card.goal{flex-direction:row;align-items:center;gap:14px}
.ring{width:64px;height:64px;flex:none}
.pill{display:inline-block;font-size:.75rem;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--accent-soft)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{text-align:center;font-size:.7rem;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.badge b{font-size:1.7rem;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--sun-soft)}
.badge.locked b{filter:grayscale(1);opacity:.35;background:var(--line)}
.built{min-height:52px;border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.built .pill{font-size:1rem;padding:5px 12px}
.wordbank{display:flex;flex-wrap:wrap;gap:8px}
.word{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;padding:9px 14px;font-weight:800}
.word:disabled{opacity:.25}
.card.update{border:2px solid var(--sun);background:var(--sun-soft)}
.road{display:flex;flex-direction:column;gap:8px}
.stage-row{display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg);border:2px solid var(--line);padding:10px 12px;width:100%}
.stage-row .dot{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--line);color:var(--muted)}
.stage-row .st-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.stage-row small{color:var(--muted);font-weight:700}
.stage-row .track{height:6px}
.stage-row .track i{background:var(--accent)}
.stage-row.done .dot{background:var(--good);color:#fff}
.stage-row.done .track i{background:var(--good)}
.stage-row.now{border-color:var(--accent);background:var(--accent-soft)}
.stage-row.now .dot{background:var(--sun);color:#3a2a00}
.stage-row.next{opacity:.75}
.topic{display:flex;align-items:center;gap:8px;font-size:.92rem}
.topic span{width:110px;flex:none}
.track{flex:1;height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:10px}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px}
.qtop .track{height:14px}
.qtop .track i{background:var(--accent);transition:width .4s}
.combo{font-family:var(--display);font-weight:800;color:var(--bad);min-width:52px;text-align:right}
.stage{display:flex;align-items:flex-end;gap:10px}
.stage .owlwrap{width:104px;flex:none}
.stage .bubble{flex:1}
.q{font-size:1.3rem;font-weight:800;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;font-weight:700;font-size:1.05rem}
.opt.ok{border-color:var(--good);background:var(--good-soft);animation:pop .35s}
.opt.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.opt:disabled{cursor:default}
.fb{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;animation:up .25s}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb b.t{font-family:var(--display);font-size:1.25rem}
.fb.ok b.t{color:var(--good)} .fb.no b.t{color:var(--bad)}
input[type=text]{font:inherit;font-size:1.05rem;width:100%;padding:13px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg);user-select:text}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.ex{border-left:4px solid var(--sun);padding-left:10px;font-style:italic}
.wrong{color:var(--bad);text-decoration:line-through;font-weight:700}
.right{color:var(--good);font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;min-height:64px;font-weight:800}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.done{animation:vanish .4s forwards;pointer-events:none}
.tile.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.flash{min-height:220px;justify-content:center;align-items:center;text-align:center;perspective:800px}
.flash .big{font-family:var(--display);font-size:2.1rem;font-weight:800}
.end{align-items:center;text-align:center}
.end .score{font-family:var(--display);font-size:3rem;font-weight:800;line-height:1}
.toggle{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.floatxp{position:fixed;z-index:30;font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--sun);text-shadow:0 2px 0 rgba(0,0,0,.25);pointer-events:none;animation:floatup 1s forwards}
#toast{position:fixed;left:16px;right:16px;top:calc(12px + var(--top));z-index:40;display:flex;justify-content:center;pointer-events:none}
#toast div{background:var(--fg);color:var(--bg);border-radius:16px;padding:12px 16px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .3s}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + var(--bottom))}
nav button{background:none;color:var(--muted);padding:6px 2px;font-size:.7rem;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;border-radius:12px}
nav button svg{width:26px;height:26px}
nav button.on{color:var(--accent);background:var(--accent-soft)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
/* Zohre moods */
.owl{display:block;width:100%;height:auto;transform-origin:50% 100%;filter:drop-shadow(0 6px 10px rgba(40,10,70,.25))}
.owl.idle{animation:breathe 3s ease-in-out infinite}
.owl.teach{animation:sway 2.6s ease-in-out infinite}
.owl.happy{animation:hop .7s}
.owl.sad{animation:shake .5s}
.say-big{font-family:var(--display);font-size:1.25rem;font-weight:800;line-height:1.2}
.bubble.happy{border-color:var(--good);background:var(--good-soft)}
.bubble.sad{border-color:var(--bad);background:var(--bad-soft)}
/* hikayeler */
.tags{display:flex;flex-wrap:wrap;gap:6px}
.story p{margin:0 0 .6em;font-size:1.15rem;line-height:1.8;font-weight:600}
.gw{color:var(--accent);font-weight:800;border-bottom:2px dotted var(--accent);cursor:pointer;border-radius:4px;padding:0 1px}
.gw.seen{background:var(--sun-soft)}
.gw.act{background:var(--accent);color:var(--accent-ink)}
#pop{position:fixed;z-index:45;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:14px;font-weight:800;font-size:1.05rem;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:280px;pointer-events:none;animation:up .15s}
#pop small{display:block;font-weight:600;font-size:.75rem;opacity:.7}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
/* ===== Winter Smells Cold: temalar ===== */
:root{--ember:#ff7a2f;--ember-soft:#ffe6d6;--snow:#eaf4ff}
@media (prefers-color-scheme:dark){:root{--ember:#ff9a57;--ember-soft:#4a2414;--snow:#1e2a44}}
body.th-dragon{background:radial-gradient(1200px 500px at 110% -10%,color-mix(in srgb,var(--ember) 18%,transparent),transparent 60%),radial-gradient(900px 500px at -20% 110%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%) fixed,var(--bg)}
body.th-winter{background:radial-gradient(1000px 500px at 50% -20%,color-mix(in srgb,var(--snow) 70%,transparent),transparent 60%) fixed,var(--bg)}
body.th-dragon header,body.th-winter header{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
.banner{border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:center;color:#fff;background:linear-gradient(120deg,#5b0a9e,#9b2fd0 55%,var(--ember));box-shadow:0 6px 18px rgba(91,10,158,.3)}
.th-winter .banner{background:linear-gradient(120deg,#3b2a8a,#5b7fd6 60%,#9fd3ff)}
.banner .big{font-size:2.4rem;line-height:1}
.banner small{opacity:.9;font-weight:700}
.coin{display:inline-flex;align-items:center;gap:4px;font-weight:800}
.chip.coins{background:var(--sun-soft);border-color:var(--sun);color:var(--fg)}
.xpbox small{gap:8px}
.xpbox small span{white-space:nowrap}
/* görevler */
.quest{display:flex;align-items:center;gap:10px}
.quest .qi{font-size:1.5rem;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);flex:none}
.quest .qb{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.quest .track{height:8px}.quest .track i{background:var(--sun)}
.quest.done .qi{background:var(--good-soft)}
.quest button{padding:8px 12px;font-size:.85rem}
/* pratik modları */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:130px}
.mode .mi{font-size:2rem;line-height:1}
.mode b{font-family:var(--display);font-size:1.1rem}
.mode small{color:var(--muted);font-weight:700;line-height:1.3}
.mode.sel{border-color:var(--accent);background:var(--accent-soft)}
.diff{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.diff button{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px}
.diff button span{font-size:1.6rem;line-height:1}
.diff button small{color:var(--muted);font-size:.72rem}
.diff button.sel{border-color:var(--ember);background:var(--ember-soft)}
/* ejderha savaşı */
.arena{display:flex;align-items:flex-end;gap:8px}
.arena .owlwrap{width:84px;flex:none}
.arena .bubble{flex:1;font-size:.95rem}
.foe{width:96px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.foe .dr{font-size:3.6rem;line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25));transform:scaleX(-1)}
.foe.s1 .dr{font-size:2.8rem}.foe.s3 .dr{font-size:4.4rem}
.foe .hp{width:100%;height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.foe .hp i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--ember));transition:width .4s}
.foe small{font-weight:800;font-size:.72rem;color:var(--muted)}
.foe.hit .dr{animation:hit .45s}
.foe.fire .dr{animation:roar .6s}
.hearts{font-size:1.05rem;letter-spacing:1px;white-space:nowrap}
.boom{position:fixed;z-index:31;font-size:2.4rem;pointer-events:none;animation:boom .7s forwards}
@keyframes hit{20%{transform:scaleX(-1) translateX(10px) rotate(8deg);filter:brightness(2)}60%{transform:scaleX(-1) translateX(-4px)}}
@keyframes roar{30%{transform:scaleX(-1) scale(1.18)}}
@keyframes boom{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.3);opacity:1}100%{transform:scale(1) translateY(-30px);opacity:0}}
.chest{font-size:4rem;line-height:1;animation:hop .8s 2}
/* Zohre'nin dünyası */
.room{position:relative;height:330px;border-radius:24px;overflow:hidden;border:2px solid var(--line);background:var(--wall,#f3e6ff)}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:34%;background:var(--floor,#e0c39a)}
.room .slot{position:absolute;line-height:1;text-align:center}
.room .s-window{left:6%;top:7%;width:30%;height:28%;border-radius:12px;border:5px solid #fff8;background:var(--sky,#bfe3ff);display:grid;place-items:center;font-size:1.8rem}
.room .s-wall{left:42%;top:8%;font-size:2rem}
.room .s-shelf{right:5%;top:10%;min-width:28%;white-space:nowrap;padding:6px 4px 4px;border-bottom:6px solid #8a5a35;font-size:1.25rem;letter-spacing:-2px}
.room .s-lamp{left:5%;bottom:30%;font-size:2.2rem}
.room .s-plant{right:5%;bottom:30%;font-size:2.4rem}
.room .s-rug{left:22%;right:22%;bottom:6%;height:14%;border-radius:50%;background:var(--rug,transparent)}
.room .s-toy{left:10%;bottom:6%;font-size:2rem}
.room .s-pet{right:12%;bottom:8%;font-size:2.4rem;animation:breathe 2.4s ease-in-out infinite}
.room .zoh{position:absolute;left:50%;bottom:8%;width:150px;transform:translateX(-50%)}
.worn{position:relative;container-type:inline-size}
.worn .acc{position:absolute;line-height:1;pointer-events:none;text-align:center}
.worn .a-head{left:58%;top:-2%;font-size:22cqw;transform:translateX(-50%) rotate(-10deg)}
.worn .a-eyes{left:50%;top:24%;font-size:44cqw;transform:translateX(-50%)}
.worn .a-neck{left:50%;top:50%;font-size:30cqw;transform:translateX(-50%)}
.worn .a-side{right:-14%;bottom:-2%;font-size:28cqw}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.item .ie{font-size:2rem;line-height:1.1;min-height:2.2rem}
.item b{font-size:.8rem;line-height:1.2}
.item small{font-size:.72rem;color:var(--muted);font-weight:800}
.item.own{border-color:var(--good)}
.item.on{background:var(--good-soft)}
.item.lock{opacity:.6}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.cats button{flex:none;padding:8px 12px;background:var(--surface);border:2px solid var(--line);font-size:.85rem}
.cats button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@keyframes hop{30%{transform:translateY(-18px) scale(1.06,.94)}60%{transform:translateY(0) scale(.95,1.05)}}
@keyframes breathe{50%{transform:scale(1.03,.97)}}
@keyframes sway{50%{transform:rotate(-3deg)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@keyframes vanish{40%{transform:scale(1.08)}100%{transform:scale(.6);opacity:0}}
@keyframes floatup{to{transform:translateY(-60px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<div id="pop" hidden></div>
<canvas id="fx"></canvas>

<script>
/* ===== AYAR: GitHub deposu kurulunca Claude burayı doldurur ===== */
const APP_BUILD = 0; // GitHub derlemesi bunu sürüm numarasıyla değiştirir
const IS_NATIVE = !!window.Capacitor?.isNativePlatform?.(); // Android uygulaması mı, web sürümü mü
const APK_URL = "https://github.com/BaranGamga/barely-english-apk/releases/latest/download/BarelyEnglish.apk";
/* Uygulama içi güncelleme: APK'yı indirir, Android kurulum ekranını açar */
async function installUpdate(btn){
  const P = window.Capacitor?.Plugins, FS = P?.Filesystem, FO = P?.FileOpener;
  if (!FS || !FO){ window.open(APK_URL, "_blank"); return; }
  btn.disabled = true; btn.textContent = "İndiriliyor… %0";
  let h = null;
  try { h = await FS.addListener("progress", e => { if (e.contentLength) btn.textContent = "İndiriliyor… %" + Math.round(100*e.bytes/e.contentLength); }); } catch(e){}
  try {
    await FS.downloadFile({ url: APK_URL + "?t=" + Date.now(), path: "BarelyEnglish.apk", directory: "CACHE", progress: true, recursive: true });
    const { uri } = await FS.getUri({ path: "BarelyEnglish.apk", directory: "CACHE" });
    btn.textContent = "Kurulum açılıyor…";
    await FO.openFile({ path: uri, mimeType: "application/vnd.android.package-archive" });
    btn.textContent = "📲 Açılan ekranda “Yükle”ye dokun"; btn.disabled = false;
  } catch(e){
    btn.disabled = false; btn.textContent = "🔄 Tekrar dene";
    toast("Güncelleme indirilemedi. İnternet bağlantını kontrol et.");

let AC=null;
function tone(f, t0, dur, type="sine", vol=.18){
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f, AC.currentTime+t0);
  g.gain.setValueAtTime(0, AC.currentTime+t0); g.gain.linearRampToValueAtTime(vol, AC.currentTime+t0+.01); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime+t0+dur);
  o.connect(g).connect(AC.destination); o.start(AC.currentTime+t0); o.stop(AC.currentTime+t0+dur+.05);
}
function sfx(kind, combo=0){
  if (!S.settings.sound) return;
  try { AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if (AC.state==="suspended") AC.resume(); } catch(e){ return; }
  const up = Math.min(combo,8)*40;
  if (kind==="ok"){ tone(660+up,0,.12,"triangle"); tone(990+up,.09,.2,"triangle"); }
  else if (kind==="no"){ tone(220,0,.18,"square",.08); tone(165,.14,.28,"square",.08); }
  else if (kind==="badge"){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.1,.25,"triangle")); }
  else if (kind==="tap"){ tone(880,0,.04,"sine",.06); }
}

const fx = document.getElementById("fx"), ctx = fx.getContext("2d"); let parts=[], raf=null;
function confetti(n=80){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  fx.width=innerWidth*devicePixelRatio; fx.height=innerHeight*devicePixelRatio;
  const cols=["#ffc928","#7b2fd0","#ff5fa2","#b47cff","#4cc3ff","#ff9de2"];
  for(let i=0;i<n;i++) parts.push({x:fx.width/2,y:fx.height*.35,vx:(Math.random()-.5)*22*devicePixelRatio,vy:(-Math.random()*18-6)*devicePixelRatio,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,life:0});
  if (!raf) loop();
}
function loop(){
  ctx.clearRect(0,0,fx.width,fx.height);
  parts.forEach(p=>{ p.life++; p.vy+=.6*devicePixelRatio; p.vx*=.98; p.x+=p.vx; p.y+=p.vy; p.a+=.2;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r,-p.r/2,p.r*2*devicePixelRatio/1.5,p.r*devicePixelRatio/1.5); ctx.restore(); });
  parts = parts.filter(p=>p.y<fx.height+40 && p.life<200);
  raf = parts.length ? requestAnimationFrame(loop) : (ctx.clearRect(0,0,fx.width,fx.height), null);
}

/* ---------- quiz ---------- */
let Q=null;
function startQuiz(mode, arg){
  let list;
  if (mode==="story"){
    list = storyQuiz(arg);
  } else if (mode==="due"){
    // önce vakti gelen tekrarlar (en zayıflar başta), sonra sıradaki aşamadan yeni sorular
    const rev = reviewItems().sort((a,b)=>weakScore(b)-weakScore(a));
    const revPick = shuffle(rev.slice(0,4)).concat(shuffle(rev.slice(4))).slice(0,7);
    const order = Object.fromEntries(STAGES.map((s,i)=>[s.id,i]));
    const fresh = newItems().sort((a,b)=>(order[a.sid]??0)-(order[b.sid]??0));
    list = [...revPick, ...fresh.slice(0, 10-revPick.length)];
    if (list.length<10) list = list.concat(shuffle(ALL_Q.filter(q=>!list.includes(q) && S.cards[q.id])).slice(0,10-list.length));
    list = shuffle(list);
  } else {
    let pool = mode==="weak" ? weakItems() : mode==="topic" ? ALL_Q.filter(q=>q.topic===arg) : mode==="stage" ? stageItems(arg)
      : mode==="hardv" ? hardWords().map(v=>ALL_Q.find(q=>q.id===v.id)).filter(Boolean)
      : mode==="mistakes" ? mistakeDrill() : ALL_Q;
    if (!pool.length) pool = ALL_Q;
    const weakFirst = mode==="weak"||mode==="hardv"||mode==="mistakes" ? [] : weakItems().filter(q=>pool.includes(q)).slice(0,3);
    list = shuffle([...new Set([...weakFirst, ...shuffle(pool)])].slice(0,10));
  }
  if (!list.length){ $app.innerHTML=`<div class="card">Henüz soru yok. İlk ders notunu ekleyince burası dolacak.</div>`; return; }
  Q = { list, i:0, score:0, combo:0, wrongs:[], mode, arg };
  ask("teach", mode==="story" ? "Hikayedeki kelimeleri hatırlıyor musun? Hadi bakalım!" : mode==="topic"||mode==="stage" ? "Bu konuyu birlikte tekrar edelim!" : mode==="mistakes" ? "Bu hataları bir daha yapmayalım!" : mode==="hardv" ? "Zor kelimelerin üzerine gidiyoruz!" : "Hazırsan başlayalım!");
}
function ask(mood, line){
  const B = Q.battle;
  if (B && (B.hp<=0 || B.hearts<=0)) return endBattle();
  if (Q.i >= Q.list.length) return B ? endBattle() : endQuiz();
  const it = Q.list[Q.i];
  const correct = it.answerText ?? (it.options ? it.options[it.answer] : it.answer);
  const top = B
    ? `<div class="qtop"><button class="iconbtn" id="quit" aria-label="Çık">${SVG('<path d="M18 6L6 18M6 6l12 12"/>')}</button><div class="hearts" id="hearts">${heartsHTML()}</div><div style="flex:1"></div><div class="combo" id="combo">${Q.combo>=2?"🔥"+Q.combo:""}</div></div>
       <div class="arena"><div class="owlwrap" id="owl">${owl(mood)}</div><div class="bubble" id="say">${esc(line)}</div>${foeHTML()}</div>`
    : `<div class="qtop"><button class="iconbtn" id="quit" aria-label="Çık">${SVG('<path d="M18 6L6 18M6 6l12 12"/>')}</button><div class="track"><i style="width:${100*Q.i/Q.list.length}%"></i></div><div class="combo" id="combo">${Q.combo>=2?"🔥"+Q.combo:""}</div></div>
    <div class="stage"><div class="owlwrap" id="owl">${owl(mood)}</div><div class="bubble" id="say">${esc(line)}</div></div>`;
  const om = it.type==="write" && /^Sırala:\s*(.+)$/i.exec(it.q);
  const words = it.tiles ? shuffle(it.tiles) : om ? shuffle(om[1].split("/").map(w=>w.trim()).filter(Boolean)) : null;
  const body = it.type==="write"
    ? (words ? `<div class="built" id="built"><span class="muted">Kelimelere sırayla dokun</span></div><div class="wordbank">${words.map((w,k)=>`<button class="word" data-k="${k}">${esc(w)}</button>`).join("")}</div><div class="row"><button class="btn soft" id="clr">Temizle</button><button class="btn" id="chk">Kontrol et</button></div><input type="hidden" id="ans">`
             : `<input type="text" id="ans" autocomplete="off" autocapitalize="sentences" placeholder="Cevabını yaz"><button class="btn wide" id="chk">Kontrol et</button>`)
    : `<div class="opts">${shuffle(it.options).map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  $app.innerHTML = `${top}<div class="card"><span class="pill" style="align-self:flex-start">${esc(tName(it.topic))}</span><div class="q">${esc(it.q)}</div>${body}<div id="fb"></div></div>`;
  document.getElementById("quit").onclick = () => go(Q.mode==="story" ? "story" : B ? "play" : "home");
  if (it.type==="write"){
    const norm = s => s.toLowerCase().replace(/[’']/g,"'").replace(/[.!?,]/g,"").replace(/\s+/g," ").trim();
    const inp = document.getElementById("ans");
    const accepted = [correct, ...(it.accept||[])].map(norm);
    if (words){
      const built = document.getElementById("built"), picked = [];
      const show = () => { built.innerHTML = picked.length ? picked.map(k=>`<span class="pill">${esc(words[k])}</span>`).join(" ") : `<span class="muted">Kelimelere sırayla dokun</span>`; inp.value = picked.map(k=>words[k]).join(" "); };
      $app.querySelectorAll(".word").forEach(b => b.onclick = () => { if (b.disabled) return; sfx("tap"); picked.push(+b.dataset.k); b.disabled = true; show(); });
      document.getElementById("clr").onclick = () => { picked.length = 0; $app.querySelectorAll(".word").forEach(b=>b.disabled=false); show(); };
    }
    const chk = () => { if (!inp.value.trim()) return; inp.disabled=true; $app.querySelectorAll(".word,#clr").forEach(b=>b.disabled=true); document.getElementById("chk").remove(); answer(it, accepted.includes(norm(inp.value)), correct, words ? document.getElementById("built") : inp); };
    document.getElementById("chk").onclick = chk; inp.onkeydown = e => { if (e.key==="Enter") chk(); };
    return;
  }
  $app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const ok = b.dataset.v === correct;
    $app.querySelectorAll(".opt").forEach(x => { x.disabled=true; if (x.dataset.v===correct) x.classList.add("ok"); });
    if (!ok) b.classList.add("no");
    answer(it, ok, correct, b);
  });
}
function answer(it, ok, correct, el){
  grade(it, ok);
  document.getElementById("owl").innerHTML = owl(ok?"happy":"sad");
  const say = document.getElementById("say"); say.className = "bubble say-big "+(ok?"happy":"sad");
  if (ok){
    Q.score++; Q.combo++; S.best=Math.max(S.best,Q.combo); save();
    sfx("ok", Q.combo); buzz(true); floatXP(el);
    say.textContent = Q.combo>=3 ? `${pick(PRAISE)} 🔥${Q.combo}` : pick(PRAISE);
    if ([3,5,10,15].includes(Q.combo)) confetti(40+Q.combo*6);
  } else {
    if (Q.combo>=3) toast("💔 "+Q.combo+"'lu kombo bozuldu");
    Q.combo=0; Q.wrongs.push(it);
    sfx("no"); buzz(false);
    say.textContent = pick(COMFORT);
    if (!Q.list.slice(Q.i+1).includes(it) && Q.list.length<14) Q.list.push(it); // aynı turda bir kez daha
  }
  document.getElementById("combo").textContent = Q.combo>=2 ? "🔥"+Q.combo : "";
  const B = Q.battle; let over = false;
  if (B){
    const foe = document.querySelector(".foe");
    if (ok){ const dmg = Q.combo>=5 ? 2 : 1; B.hp = Math.max(0, B.hp-dmg); B.coins += Q.combo>=3 ? 2 : 1; foe.classList.add("hit"); boom(foe, dmg>1?"💥💥":"💥"); if (dmg>1) toast("🔥 Kritik vuruş! Seri 5+ = çift hasar");
      document.getElementById("say").textContent = B.hp<=0 ? "Ejderhayı yendin! 🏆" : Q.combo>=3 ? `${pick(PRAISE)} 🔥${Q.combo}` : pick(PRAISE); }
    else { B.hearts--; foe.classList.add("fire"); boom(document.getElementById("owl"), "🔥");
      document.getElementById("say").textContent = B.hearts<=0 ? "Ejderha bu sefer kazandı… Tekrar deneyelim!" : pick(COMFORT); }
    foe.querySelector(".hp i").style.width = (100*B.hp/B.max)+"%"; foe.querySelector("small").textContent = B.hp+" / "+B.max;
    document.getElementById("hearts").innerHTML = heartsHTML();
    over = B.hp<=0 || B.hearts<=0;
  }
  document.getElementById("fb").innerHTML = `<div class="fb ${ok?'ok':'no'}"><b class="t">${ok?(B?"Doğru! 💥 +🪙":"Doğru! +10"):"Doğrusu: "+esc(correct)}</b>${it.explain?`<div>${esc(it.explain)}</div>`:""}<button class="btn wide" id="next">${over?"Sonucu gör 🏁":"Devam"}</button></div>`;
  const n=document.getElementById("next"); n.scrollIntoView({behavior:"smooth",block:"nearest"});
  n.onclick = () => { Q.i++; sfx("tap"); ask("teach", Q.combo>=2?"Devam, seri sürüyor! 🔥":"Sıradaki soru…"); };
}
function endQuiz(){
  const total = Q.list.length, perfect = Q.score===total;
  if (perfect && !S.badges.perfect){ S.badges.perfect=today(); save(); checkBadges(); }
  if (perfect) { confetti(200); sfx("badge"); }
  const uniqWrong = [...new Set(Q.wrongs)];
  if (Q.mode==="story"){ const s=sState(Q.arg), pct=Math.round(100*Q.score/total); s.best=Math.max(s.best??0,pct); save(); qev("storyquiz"); }
  if (perfect) qev("perfect");
  qev("round");
  $app.innerHTML = `<div class="card end"><div style="width:120px">${owl(perfect||Q.score/total>=.7?"happy":"sad")}</div>
    <div class="score">${Q.score}/${total}</div>
    <h2>${perfect?"Hatasız tur! Wow, you are improving! 💯":Q.score/total>=.7?"Wow, you are improving!":"Hey, sıkı çalış! Pes etmek yok."}</h2>
    <p class="muted" style="margin:0">${uniqWrong.length?"Yanlış yaptıkların listene eklendi. Doğru bilene kadar yeniden karşına çıkacak.":"Bildiklerin daha seyrek sorulacak."}</p>
    ${uniqWrong.length?`<div style="text-align:left;width:100%;display:flex;flex-direction:column;gap:6px">${uniqWrong.map(q=>`<div class="pill bad" style="white-space:normal">${esc(q.q)} → ${esc(q.answerText ?? (q.options?q.options[q.answer]:q.answer))}</div>`).join("")}</div>`:""}
    <div class="row" style="width:100%"><button class="btn" id="again">Yeni tur</button><button class="btn soft" id="toHome">${Q.mode==="story"?"Hikayeler":"Ana sayfa"}</button></div></div>`;
  const {mode, arg} = Q;
  document.getElementById("again").onclick = () => go("play", ["stage","topic","mistakes","hardv","weak","story"].includes(mode) ? mode : "due", arg);
  document.getElementById("toHome").onclick = () => go(mode==="story" ? "story" : "home");
}

function todaysQuests(){
  let h = 7; for (const c of today()) h = (h*31 + c.charCodeAt(0)) >>> 0;
  const pool = QUESTS.slice(1), out = [QUESTS[0]];
  while (out.length<3){ h = (h*1103515245 + 12345) >>> 0; out.push(pool.splice(h % pool.length, 1)[0]); }
  return out;
}
function qev(type, n=1){
  const w = W(), d = today();
  if (w.q.d!==d) w.q = { d, p:{}, got:{} };
  w.q.p[type] = (w.q.p[type]||0) + n;
  w.n[type] = (w.n[type]||0) + n;
  const wq = themeOf().weekly;
  if (wq){
    if (w.wk.id!==wq.id) w.wk = { id:wq.id, p:{} };
    w.wk.p[type] = (w.wk.p[type]||0) + n;
    if (!w.owned[wq.item] && (w.wk.p[wq.ev]||0) >= wq.n) giveItem(wq.item, "🏆 Haftalık görev tamam!");
  }
  todaysQuests().forEach(q => { w.q.ready ??= {}; if (!w.q.got[q.id] && !w.q.ready[q.id] && (w.q.p[q.ev]||0) >= q.n){ w.q.ready[q.id] = 1; setTimeout(()=>toast("✅ Görev tamam: "+q.t+" · ödülünü al!"), 900); } });
  save(); checkUnlocks();
}

/* zorluk: müfredat sırası zorluk sırasıdır. Kolay = ilk %40 aşama, Orta = ilk %75, Zor = hepsi (sonraki aşamalar ağırlıklı) */
function stageSet(diff){ const n = STAGES.length, max = diff===1 ? Math.ceil(n*.4) : diff===2 ? Math.ceil(n*.75) : n; return new Set(STAGES.slice(0, max).map(s=>s.id)); }
const tokens = s => s.replace(/[.!?,]/g, "").split(/\s+/).filter(Boolean);
function translateItems(diff){
  const out = [];
  DATA.lessons.forEach(L => (L.translate||[]).forEach((t, i, arr) => {
    if (diff===1 && i >= Math.ceil(arr.length*.6)) return;
    const extra = diff===1 ? [] : diff===2 ? (t.distract||[]).slice(0,1) : (t.distract||[]);
    out.push({ id:"tr:"+L.id+":"+i, type:"write", topic:"translate", sid:L.id, q:"🇹🇷 “"+t.tr+"”", tiles:[...tokens(t.en), ...extra], answer:t.en, accept:t.accept||[], explain:"✓ "+t.en });
  }));
  return out;
}
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function clozeItems(diff){
  const out = ALL_Q.filter(q => /_{3}/.test(q.q) && !String(q.id).startsWith("vq:"));
  ALL_V.forEach(v => {
    if (!v.ex) return;
    const re = new RegExp("\\b"+reEsc(v.en)+"\\b", "i"); if (!re.test(v.ex)) return;
    const same = ALL_V.filter(x=>x.sid===v.sid && x.en!==v.en), rest = ALL_V.filter(x=>x.sid!==v.sid && x.en!==v.en);
    const q = "Boşluğu doldur: "+v.ex.replace(re, "___");
    if (diff===3 && v.en.split(" ").length<=2) out.push({ id:"cz:"+v.en, type:"write", topic:"cloze", sid:v.sid, q:q+" ("+v.tr+")", answer:v.en, explain:v.en+" = "+v.tr });
    else out.push({ id:"cz:"+v.en, topic:"cloze", sid:v.sid, q, options:[v.en, ...[...shuffle(same), ...shuffle(rest)].slice(0,3).map(x=>x.en)], answerText:v.en, explain:v.en+" = "+v.tr });
  });
  return out;
}
function grammarItems(diff){
  let out = ALL_Q.filter(q => q.topic!=="vocab" && !String(q.id).startsWith("vq:") && (diff>1 || q.type!=="write"));
  if (diff===3) out = out.concat(ALL_M.map(m => ({ id:"m:"+m.wrong, topic:m.topic||"mistakes", type:"write", q:"Cümleyi düzelt: “"+m.wrong+"”", answer:m.right, explain:m.note, sid:m.sid })));
  return out;
}
function battlePool(mode, diff){
  if (!DATA) return [];
  const set = stageSet(diff), inSet = q => !q.sid || set.has(q.sid);
  const by = { translate:translateItems, cloze:clozeItems, grammar:grammarItems };
  if (mode!=="mix") return by[mode](diff).filter(inSet);
  return [...translateItems(diff), ...clozeItems(diff), ...grammarItems(diff), ...ALL_Q.filter(q=>String(q.id).startsWith("vq:"))].filter(inSet);
}
/* seçim: önce zayıflar (en çok 3), sonra yeni/vakti gelenler; konular karışsın diye aşamalara göre sırayla dağıtılır */
function spread(list){
  const g = {}; list.forEach(q => (g[q.sid||"x"] ||= []).push(q));
  const keys = shuffle(Object.keys(g)), out = [];
  while (out.length < list.length) keys.forEach(k => { const x = g[k].shift(); if (x) out.push(x); });
  return out;
}
function pickBattle(pool, n, diff){
  if (diff===3){ const order = Object.fromEntries(STAGES.map((s,i)=>[s.id,i])), half = STAGES.length/2; pool = [...pool].sort(() => Math.random()-.5).sort((a,b) => ((order[b.sid]??0)>=half) - ((order[a.sid]??0)>=half)); }
  const weak = shuffle(pool.filter(q => (S.cards[q.id]?.wrong||0)>0 && S.cards[q.id].box<3)).slice(0,3);
  const fresh = pool.filter(q => !S.cards[q.id] || S.cards[q.id].due<=Date.now());
  const head = diff===3 ? pool.slice(0, Math.ceil(pool.length*.6)) : pool;
  return [...new Set([...weak, ...spread(shuffle(fresh.filter(q=>head.includes(q)))), ...spread(shuffle(pool))])].slice(0, n+5);
}

/* 20 kelimelik kart turu: önce zor kelimeler, sonra sıradaki aşamaların yeni/vakti gelen kelimeleri */
function flashDeck(){
  const order = Object.fromEntries(STAGES.map((s,i)=>[s.id,i])), cur = currentStageIdx();
  const hard = shuffle(hardWords()).slice(0,8);
  const due = ALL_V.filter(v=>!hard.includes(v) && (S.cards[v.id]?.due||0)<=Date.now() && (order[v.sid]??0)<=cur+1)
    .sort((a,b)=>((S.cards[a.id]?1:0)-(S.cards[b.id]?1:0)) || ((order[a.sid]??0)-(order[b.sid]??0)));
  let deck = [...hard, ...due].slice(0,20);
  if (deck.length<20) deck = deck.concat(shuffle(ALL_V.filter(v=>!deck.includes(v))).slice(0,20-deck.length));
  return shuffle(deck);
}

function match(pool, opt={}){
  if (ALL_V.length<2){ $app.innerHTML=`<div class="card">Eşleştirme için en az 2 kelime gerekli.</div>`; return; }
  const fromHard = Array.isArray(pool) && pool.length>=2;
  const weakV = fromHard ? [] : hardWords().slice(0,2);
  const set = fromHard ? (opt.ordered ? pool.slice(0,6) : shuffle(pool).slice(0,6)) : shuffle([...new Set([...weakV, ...shuffle(ALL_V)])].slice(0,6));
  let sel=null, left=set.length, misses=0, combo=0; const t0=Date.now();
  const tiles = [...shuffle(set).map(v=>({k:v.en,t:v.en})), ...shuffle(set).map(v=>({k:v.en,t:v.tr}))];
  const lft = tiles.slice(0,set.length), rgt = tiles.slice(set.length);
  $app.innerHTML = `<div class="qtop"><button class="iconbtn" id="quit">${SVG('<path d="M18 6L6 18M6 6l12 12"/>')}</button><h2 style="flex:1">Eşleştir</h2><div class="combo" id="mc"></div></div>
    <div class="grid2">${lft.map((x,i)=>`<button class="tile" data-i="${i}">${esc(x.t)}</button>${`<button class="tile" data-i="${i+set.length}">${esc(rgt[i].t)}</button>`}`).join("")}</div><div id="mend"></div>`;
  document.getElementById("quit").onclick = () => go(opt.back || "cards");
  $app.querySelectorAll(".tile").forEach(b => b.onclick = () => {
    const x = tiles[+b.dataset.i]; sfx("tap");
    if (!sel){ sel=b; b.classList.add("sel"); return; }
    if (sel===b){ b.classList.remove("sel"); sel=null; return; }
    const y = tiles[+sel.dataset.i];
    if ((+b.dataset.i<set.length) === (+sel.dataset.i<set.length)){ sel.classList.remove("sel"); sel=b; b.classList.add("sel"); return; }
    const v = set.find(v=>v.en===y.k);
    if (x.k===y.k){ [b,sel].forEach(e=>e.classList.add("done")); combo++; sfx("ok",combo); buzz(true); grade({id:v.id,topic:"vocab"},true); left--; }
    else { misses++; combo=0; sfx("no"); buzz(false); grade({id:v.id,topic:"vocab"},false); const a=sel; [b,a].forEach(e=>{e.classList.add("bad"); setTimeout(()=>e.classList.remove("bad","sel"),450)}); }
    sel.classList.remove("sel"); sel=null;
    document.getElementById("mc").textContent = combo>=2?"🔥"+combo:"";
    if (!left){
      qev("match");
      const sec = Math.round((Date.now()-t0)/1000);
      if (!misses) confetti(120);
      document.getElementById("mend").innerHTML = `<div class="card end"><div style="width:100px">${owl(misses<2?"happy":"sad")}</div><h2>${misses?misses+" hata, "+sec+" saniye":"Hatasız! "+sec+" saniye ⚡"}</h2><button class="btn wide" id="mm">Yeni tur</button></div>`;
      document.getElementById("mm").onclick = () => match(opt.again ? opt.again() : fromHard ? hardWords() : undefined, opt);
    }
  });
}
function flash(list, i, back, st){
  st = st || { known:[], missed:[], total:list.length, hard:false };
  st.known = st.known || []; st.missed = st.missed || []; st.total = st.total || list.length;
  if (!list.length){ go("cards"); return; }
  if (i>=list.length) return flashEnd(st);
  const v = list[i];
  $app.innerHTML = `<div class="qtop"><button class="iconbtn" id="quit">${SVG('<path d="M18 6L6 18M6 6l12 12"/>')}</button><div class="track"><i style="width:${100*i/list.length}%;background:var(--accent)"></i></div><span>${i+1}/${list.length}</span></div>
    <div class="card flash" id="fc">${back?`<div class="big">${esc(v.tr)}</div><div class="ex">${esc(v.ex)}</div>`:`<div class="big">${esc(v.en)}</div><div class="muted">Anlamını düşün, sonra dokun</div>`}</div>
    ${back?`<div class="row"><button class="btn soft" id="no">😕 Bilemedim</button><button class="btn" id="yes">😎 Bildim</button></div>`:""}`;
  document.getElementById("quit").onclick = () => go("cards");
  document.getElementById("fc").onclick = () => { sfx("tap"); flash(list,i,!back,st); };
  if (back){
    const first = !st.known.includes(v) && !st.missed.includes(v);
    document.getElementById("yes").onclick = () => { if (first) st.known.push(v); grade({id:v.id,topic:"vocab"},true); sfx("ok"); buzz(true); flash(list,i+1,false,st); };
    document.getElementById("no").onclick = () => { if (!st.missed.includes(v)){ st.missed.push(v); st.known = st.known.filter(x=>x!==v); } grade({id:v.id,topic:"vocab"},false); sfx("no"); buzz(false); list.push(v); flash(list,i+1,false,st); };
  }
}
function flashEnd(st){
  qev("flash");
  const k = st.known.length, m = st.missed.length, good = m <= Math.round(st.total*0.25);
  if (!m) { confetti(150); sfx("badge"); }
  $app.innerHTML = `<div class="card end"><div style="width:120px">${owl(good?"happy":"sad")}</div>
    <div class="score">${k}/${st.total}</div>
    <h2>${!m?"Hepsini bildin! Wow, you are improving! 💯":good?"Wow, you are improving!":"Hey, sıkı çalış!"}</h2>
    ${m?`<p class="muted" style="margin:0">Bilemediğin ${m} kelime 📌 Zor Kelimelerim listene kaydedildi.</p>
      <div style="width:100%;display:flex;flex-direction:column;gap:6px;text-align:left">${st.missed.map(v=>`<div class="pill bad" style="white-space:normal"><b>${esc(v.en)}</b> — ${esc(v.tr)}</div>`).join("")}</div>`:""}
    <div class="row" style="width:100%">${m?`<button class="btn" id="fh">📌 Zor kelimeleri çalış</button>`:""}<button class="btn ${m?"soft":""}" id="fn">🃏 Yeni 20 kelime</button></div>
    <button class="btn soft wide" id="fb">Kelimelere dön</button></div>`;
  const fh=document.getElementById("fh"); if (fh) fh.onclick = () => flash(shuffle(hardWords()).slice(0,20),0,false,{hard:true});
  document.getElementById("fn").onclick = () => flash(flashDeck(),0,false);
  document.getElementById("fb").onclick = () => go("cards");
}

// Metinde [[english|türkçe]] = yeni kelime. Dokunulan kelimeler S.storyTaps'e kaydedilir ve o hikayenin sınavında öncelikle sorulur.
const STORIES = () => DATA?.stories || [];
const GL = /\[\[([^|\]]+)\|([^\]]+)\]\]/g;
const plain = s => s.replace(GL, "$1");
function storyWords(st){
  const m = new Map();
  st.pages.forEach(p => { for (const x of p.matchAll(GL)) if (!m.has(x[1])) m.set(x[1], x[2]); });
  return [...m].map(([en,tr]) => ({ en, tr, id:"sw:"+st.id+":"+en, ex:"" }));
}
const sState = id => { S.stories = S.stories || {}; return S.stories[id] || (S.stories[id] = { page:0, read:false, best:null }); };
const taps = id => { S.storyTaps = S.storyTaps || {}; return S.storyTaps[id] || (S.storyTaps[id] = {}); };
/* tıklanan kelimeler önde, sonra henüz öğrenilmemiş olanlar */
function storyPool(st){
  const T = taps(st.id), lv = w => (S.cards[w.id]?.box||0);
  const W = storyWords(st);
  return [...shuffle(W.filter(w=>T[w.en])), ...shuffle(W.filter(w=>!T[w.en])).sort((a,b)=>lv(a)-lv(b))];
}

function storyMatch(id){

    <div class="row">${p>0?`<button class="btn soft" id="prev">← Önceki</button>`:""}${!last?`<button class="btn" id="next">Sonraki →</button>`:""}</div>
    ${last?`<div class="card end"><div style="width:110px">${owl("happy")}</div><h2>Hikaye bitti! Wow, you are improving!</h2>
      ${seen.length?`<p class="muted" style="margin:0">Baktığın ${seen.length} kelime sınavda karşına çıkacak:</p><div class="tags" style="justify-content:center">${seen.map(w=>`<span class="pill">${esc(w.en)} = ${esc(w.tr)}</span>`).join("")}</div>`:`<p class="muted" style="margin:0">Sınavda hikayedeki yeni kelimeler ve hikayeyle ilgili sorular var.</p>`}
      <div class="row" style="width:100%"><button class="btn" id="sq">⚡ Sınava başla</button><button class="btn soft" id="sm">🧩 Eşleştir</button></div>
      <button class="btn soft wide" id="sl">Hikayelere dön</button></div>`:""}`;
  document.getElementById("back").onclick = () => go("story");
  const pv=document.getElementById("prev"); if (pv) pv.onclick = () => { sfx("tap"); reader(id, p-1); };

/* hikaye sınavı: tıklanan kelimeler (boşluk doldurma / anlam / ters çeviri) + hikayeye özel sorular, toplam ~10 */
function storyQuiz(id){
  const st = STORIES().find(x=>x.id===id); if (!st) return [];
  const T = taps(id), pool = storyPool(st), W = storyWords(st);
  const nTap = pool.filter(w=>T[w.en]).length;
  const nWords = Math.min(pool.length, Math.max(5, Math.min(nTap, 8)));
  const sentences = st.pages.flatMap(p => p.replace(/([.!?…]["”]?)\s+/g, "$1\n").split("\n"));
  const others = (w, k) => shuffle(W.filter(x=>x.en!==w.en)).slice(0,3).map(x=>x[k]);
  const words = pool.slice(0, nWords).map((w, i) => {
    const sent = sentences.find(x => x.includes("[["+w.en+"|"));
    const kind = T[w.en] ? (i%3===1 ? "mean" : i%3===2 ? "rev" : "fill") : (i%2 ? "mean" : "fill");
    if (kind==="fill" && sent){
      const q = plain(sent.replace("[["+w.en+"|"+w.tr+"]]", "___")).trim();
      return { id:"sf:"+id+":"+w.en, topic:"story", q:"Boşluğu doldur: "+q, options:[w.en, ...others(w,"en")], answerText:w.en, explain:w.en+" = "+w.tr };
    }
    if (kind==="rev") return { id:"sr:"+id+":"+w.en, topic:"story", q:"“"+w.tr+"” hikayede hangi kelimeydi?", options:[w.en, ...others(w,"en")], answerText:w.en, explain:w.en+" = "+w.tr };
    return { id:w.id, topic:"story", q:"“"+w.en+"” ne demek?", options:[w.tr, ...others(w,"tr")], answerText:w.tr, explain:sent ? plain(sent).trim() : "" };
  });
  const own = shuffle((st.questions||[]).map((q,i) => ({ ...q, id:"sq:"+id+":"+i, topic:"story" }))).slice(0, Math.max(2, 10-words.length));
  return shuffle([...words, ...own]);
}

/* sık hata alıştırması: en çok yanıldığın hatalar önde; seçmeli + "cümleyi düzelt" yazma soruları */
function mistakeDrill(){
  const sc = m => { const c=S.cards["m:"+m.wrong]; return c ? c.wrong*2 - c.box : 0.5; };
  const ms = shuffle(ALL_M).sort((a,b)=>sc(b)-sc(a)).slice(0,10);
  return ms.map((m,i) => i%2===0
    ? ALL_Q.find(q=>q.id==="m:"+m.wrong)
    : { id:"m:"+m.wrong, topic:m.topic||"mistakes", type:"write", q:"Cümleyi düzelt: “"+m.wrong+"”", answer:m.right, explain:m.note, sid:m.sid }
  ).filter(Boolean);
}

/* ---------- bildirim & geri tuşu ---------- */
async function scheduleReminder(ask){
  const LN = window.Capacitor?.Plugins?.LocalNotifications; if (!LN) return;
  try {
    await LN.cancel({notifications:[{id:1}]});
    if (!S.settings.remind) return;
    let p = await LN.checkPermissions();
    if (p.display!=="granted" && ask) p = await LN.requestPermissions();
    if (p.display!=="granted") return;
    await LN.schedule({notifications:[{ id:1, title:"Zohre seni bekliyor 🐥", body:"Bugünkü İngilizce tekrarını yapalım mı? Serini koru! 🔥", schedule:{ on:{hour:S.settings.hour, minute:0}, allowWhileIdle:true } }]});
  } catch(e){}
}
try { window.Capacitor?.Plugins?.App?.addListener("backButton", () => { if (tab==="home") window.Capacitor.Plugins.App.exitApp(); else go("home"); }); } catch(e){}
document.addEventListener("visibilitychange", () => { if (!document.hidden && DATA) loadLessons(); });

loadLessons(true).then(() => scheduleReminder(true));
// Web sürümü (iPhone "Ana Ekrana Ekle"): çevrimdışı çalışma için service worker
if (!IS_NATIVE && "serviceWorker" in navigator && location.protocol === "https:") { navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
